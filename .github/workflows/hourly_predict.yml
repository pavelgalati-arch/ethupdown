name: ETH Hourly Prediction Bot

on:
  schedule:
    # This runs at the start of every hour (00:00, 01:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch:
    # This allows you to click a button to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Prediction Script
        env:
          # This connects your GitHub Secrets to the Python script
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python eth_predict.py
